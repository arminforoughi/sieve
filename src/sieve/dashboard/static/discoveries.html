<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIEVE Discoveries</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.0/3Dmol-min.js"></script>
<style>
  .dsc { max-width: 1400px; margin: 0 auto; padding: 12px 16px; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .top .brand { font: 600 15px var(--mono); letter-spacing: 0.2em; }
  .nav a { color: var(--accent); text-decoration: none; font-size: 13px; } .nav b { font-size: 13px; }
  .top select { margin-left: auto; }
  .lead { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
  .card { display: grid; grid-template-columns: 340px minmax(0, 1fr) 300px; gap: 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .card.rec { border: 2px solid var(--green); }
  .mv { position: relative; height: 260px; border: 1px solid var(--grid); border-radius: 6px; }
  .rank { font: 600 12px var(--mono); color: var(--ink-3); letter-spacing: 0.08em; }
  .name { font: 600 20px var(--mono); margin: 2px 0 4px; }
  .head { font-size: 16px; font-weight: 600; margin: 8px 0 6px; }
  .why { font-size: 14px; line-height: 1.5; color: var(--ink); }
  .feat { margin: 8px 0 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
  .conf { font-size: 13px; color: var(--ink-2); margin-top: 8px; } .cav { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
  .tag { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--ink-2); margin-right: 4px; }
  .tag.ok { color: var(--green); border-color: var(--green); } .tag.rec { background: var(--green); color: #fff; border-color: var(--green); }
  .tag.veto { color: var(--red); border-color: var(--red); }
  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 1fr 72px; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .bar-row .track { grid-column: 1 / -1; height: 6px; background: var(--grid); border-radius: 3px; position: relative; }
  .bar-row .track i { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--accent); }
  .bar-row .v { text-align: right; font-family: var(--mono); color: var(--ink); }
  .meas { font: 12.5px var(--mono); color: var(--ink-2); margin-top: 10px; }
  .meas div { padding: 2px 0; }
  .who { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
  .muted { color: var(--ink-3); font-size: 13px; }
  .truth { font: 13px var(--mono); margin-top: 8px; }
  .mv canvas { width: 100% !important; height: 100% !important; }
  @media (max-width: 1100px) { .card { grid-template-columns: 1fr; } .mv { height: 240px; } }
</style>
</head>
<body>
<div class="dsc">
  <div class="top"><div class="brand">SIEVE</div>
    <div class="nav"><a id="n-agents" href="/agents">Agents</a> · <a id="n-room" href="/">Control room</a> · <b>Discoveries</b> · <a href="/compare">Compare</a></div>
    <select id="run-select" aria-label="Run"></select></div>
  <p class="lead" id="lead"></p>
  <div id="cards"></div>
</div>
<script src="/static/discoveries.js"></script>
</body>
</html>
